<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider checkout-page">
      <h1>Review &amp; Place Your Order</h1>
      <div class="checkout-layout">
        <form id="checkout-form" name="checkout" class="checkout-form">
          <fieldset>
            <legend>Customer</legend>
            <label>
              First Name
              <input
                type="text"
                name="fname"
                autocomplete="given-name"
                required
              />
            </label>
            <label>
              Last Name
              <input
                type="text"
                name="lname"
                autocomplete="family-name"
                required
              />
            </label>
          </fieldset>

          <fieldset>
            <legend>Shipping Address</legend>
            <label class="full-width">
              Street Address
              <input
                type="text"
                name="street"
                autocomplete="street-address"
                required
              />
            </label>
            <label>
              City
              <input
                type="text"
                name="city"
                autocomplete="address-level2"
                required
              />
            </label>
            <label>
              State
              <input
                type="text"
                name="state"
                autocomplete="address-level1"
                required
              />
            </label>
            <label>
              Zip Code
              <input
                id="zip"
                type="text"
                name="zip"
                autocomplete="postal-code"
                inputmode="numeric"
                required
              />
            </label>
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label class="full-width">
              Credit Card Number
              <input
                type="text"
                name="cardNumber"
                autocomplete="cc-number"
                inputmode="numeric"
                pattern="[0-9]{16}"
                maxlength="16"
                title="Enter a 16-digit card number"
                required
              />
            </label>
            <label>
              Expiration Date
              <input
                type="text"
                name="expiration"
                autocomplete="cc-exp"
                placeholder="MM/YY"
                pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
                title="Use MM/YY format"
                required
              />
            </label>
            <label>
              Security Code
              <input
                type="text"
                name="code"
                autocomplete="cc-csc"
                inputmode="numeric"
                pattern="[0-9]{3,4}"
                maxlength="4"
                title="Enter a 3 or 4-digit security code"
                required
              />
            </label>
          </fieldset>

          <button type="submit">Place Order</button>
          <p
            id="checkout-message"
            class="checkout-message"
            role="status"
            aria-live="polite"
          ></p>
        </form>

        <aside
          id="order-summary"
          class="order-summary"
          aria-labelledby="order-summary-title"
        >
          <h2 id="order-summary-title">Order Summary</h2>
          <div>
            <span id="item-count">0 items</span
            ><strong id="item-subtotal">$0.00</strong>
          </div>
          <div>
            <span>Tax</span><strong id="tax">Calculated after zip</strong>
          </div>
          <div>
            <span>Shipping</span
            ><strong id="shipping">Calculated after zip</strong>
          </div>
          <div class="order-summary__total">
            <span>Order Total</span><strong id="order-total">$0.00</strong>
          </div>
        </aside>
      </div>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
